name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check app tests migrations
      - run: uv run pytest
      - name: API contract is up to date
        run: uv run python -m app.export_openapi --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated types match the contract
        run: npm run gen:api && git diff --exit-code src/api/generated
      - run: npm run lint
      - run: npm run build

  # The API image must contain alembic.ini and migrations/ (the app upgrades the schema at startup).
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t fuelops-api apps/api
      - name: Image upgrades a fresh database to head
        run: >
          docker run --rm -e DATABASE_URL=sqlite+aiosqlite:////tmp/ci.db fuelops-api
          python -c "import asyncio; from app.persistence.database import Database; d = Database('sqlite+aiosqlite:////tmp/ci.db'); asyncio.run(d.init()); print('migrated')"
