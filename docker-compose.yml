services:
  backend:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      FIXTURE_DIR: /fixtures
      DATABASE_URL: sqlite+aiosqlite:////data/fuelops.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - fuel_data:/data
      - ./tests/fixtures:/fixtures:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health/live')"]
      interval: 10s

  frontend:
    build:
      context: ./apps/web
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

  # Real BUP simulator. Start with: docker compose --profile sim up --build
  # and set SIMULATOR_MODE=real in .env. Host port 9000 so it doesn't clash with the backend.
  simulator:
    profiles: ["sim"]
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
    environment:
      SIMULATION_SPEED: ${SIMULATION_SPEED:-8}
      TICK_MINUTES: ${TICK_MINUTES:-15}
      SIMULATOR_START_MODE: ${SIMULATOR_START_MODE:-paused}
    ports:
      - "127.0.0.1:9000:8000"

volumes:
  fuel_data:
